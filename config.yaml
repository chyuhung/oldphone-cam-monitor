# =============================================
# go2rtc 配置 - 旧手机转 IP 摄像头
# 使用前请阅读 README.md 完成手机端配置
# =============================================

log:
  level: info

# 对外服务的端口(可选配置)
#   :1984  网页观看(WebUI) + WebRTC 低延迟播放
#   :8554  RTSP 输出:  rtsp://服务器IP:8554/phone1
#   :1935  RTMP 输出:  rtmp://服务器IP:1935/phone1  (给支持RTMP的播放器/电视端/OBS)
rtsp:
  listen: ":8554"

api:
  listen: ":1984"

rtmp:
  listen: ":1935"

# 相机列表：把下面的地址替换成你 IP Webcam 显示的 RTSP 地址
# 格式: rtsp://用户名:密码@手机IP:8080/h264_pcm.sdp   (纯画面)
#       rtsp://用户名:密码@手机IP:8080/h264_ulaw.sdp  (H.264 + 音频, 推荐)
streams:
  phone1: rtsp://user:pass@192.168.1.100:8080/h264_ulaw.sdp

# 以后要加第二部手机/镜头, 照抄一行改成 phone2 即可